server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html (and the SPA fallback) carry no content hash in the URL and
    # point at the hashed /assets/ bundles for the actual app — so a stale
    # copy here silently pins a returning visitor to an old build forever
    # (the old JS hash it names is then served from their immutable cache).
    # no-cache was meant to force revalidation, but some mobile browsers
    # (and home-screen/standalone launches) skip that on a warm start and
    # serve the stored copy blind. no-store forbids storing it at all — the
    # entry point is ~12 KB and re-fetched every navigation, which is the
    # correct trade for something that changes every deploy.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The JS/CSS bundles are the opposite case: vite content-hashes them
    # into the filename, so a given URL's bytes never change — cache them
    # hard and skip the revalidation round-trip entirely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audio files are served from a stable, content-independent URL (unlike
    # the JS/CSS bundles, which vite content-hashes into the filename, so a
    # changed build is automatically a new URL and never has this problem).
    # Without an explicit Cache-Control, a browser's own heuristic caching
    # can treat a previous visit's copy as fresh for a long time and never
    # even revalidate — so a real, deployed fix to a track can go on sounding
    # unfixed to a returning player until a hard refresh, for no reason
    # visible from either end. no-cache forces a conditional GET (still
    # backed by the ETag nginx already sends, so an unchanged file is just a
    # cheap 304, not a full re-download) instead of trusting a stale local
    # copy.
    location /audio/ {
        add_header Cache-Control "no-cache";
    }
}
