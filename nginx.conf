server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html (and the SPA fallback) carry no content hash in the URL, so
    # without this a returning visitor's browser can heuristically treat the
    # previous visit's copy as fresh and never revalidate — a deployed
    # HTML/UI change then stays invisible until a hard refresh. Same
    # reasoning as the /audio/ block below. no-cache still allows a
    # conditional GET backed by nginx's ETag (a cheap 304 when unchanged),
    # it just forbids using a stale copy blind.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The JS/CSS bundles are the opposite case: vite content-hashes them
    # into the filename, so a given URL's bytes never change — cache them
    # hard and skip the revalidation round-trip entirely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Audio files are served from a stable, content-independent URL (unlike
    # the JS/CSS bundles, which vite content-hashes into the filename, so a
    # changed build is automatically a new URL and never has this problem).
    # Without an explicit Cache-Control, a browser's own heuristic caching
    # can treat a previous visit's copy as fresh for a long time and never
    # even revalidate — so a real, deployed fix to a track can go on sounding
    # unfixed to a returning player until a hard refresh, for no reason
    # visible from either end. no-cache forces a conditional GET (still
    # backed by the ETag nginx already sends, so an unchanged file is just a
    # cheap 304, not a full re-download) instead of trusting a stale local
    # copy.
    location /audio/ {
        add_header Cache-Control "no-cache";
    }
}
