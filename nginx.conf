server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Audio files are served from a stable, content-independent URL (unlike
    # the JS/CSS bundles, which vite content-hashes into the filename, so a
    # changed build is automatically a new URL and never has this problem).
    # Without an explicit Cache-Control, a browser's own heuristic caching
    # can treat a previous visit's copy as fresh for a long time and never
    # even revalidate — so a real, deployed fix to a track can go on sounding
    # unfixed to a returning player until a hard refresh, for no reason
    # visible from either end. no-cache forces a conditional GET (still
    # backed by the ETag nginx already sends, so an unchanged file is just a
    # cheap 304, not a full re-download) instead of trusting a stale local
    # copy.
    location /audio/ {
        add_header Cache-Control "no-cache";
    }
}
