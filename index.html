<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Voyageurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <!-- Mute/pause and the minimap (appended below the buttons by main.js)
         share the top-right corner: a column, right-aligned, so a square
         minimap wider than the two buttons still lines up sensibly under
         them. -->
    <div id="right-panel">
      <div id="right-buttons">
        <button id="mute-btn" title="Mute music">&#9835;</button>
        <button id="pause-btn" title="Pause">II</button>
      </div>
    </div>

    <!-- TEMPORARY diagnostic — see the comment at the top of twod/music.js.
         Remove this element once music is confirmed working on-device. -->
    <div id="audio-debug"></div>

    <div id="touch-dpad">
      <button type="button" id="dpad-up" class="dpad-btn dpad-up" title="Up">&#9650;</button>
      <button type="button" id="dpad-left" class="dpad-btn dpad-left" title="Left">&#9664;</button>
      <button type="button" id="dpad-right" class="dpad-btn dpad-right" title="Right">&#9654;</button>
      <button type="button" id="dpad-down" class="dpad-btn dpad-down" title="Down">&#9660;</button>
    </div>

    <div id="hud" class="hidden">
      <div id="hud-score">FURS: 0</div>
      <div id="hud-health-label">HULL HEALTH</div>
      <div id="hud-health-wrap"><div id="hud-health-fill"></div></div>
      <div id="hud-speed-label">CURRENT SPEED</div>
      <div id="hud-speed-wrap"><div id="hud-speed-fill"></div></div>
    </div>

    <div id="damage-flash"></div>

    <div id="title-screen" class="screen intro">
      <h1>VOYAGEURS</h1>
    </div>

    <div id="milestone-banner"></div>

    <div id="gameover-screen" class="screen hidden">
      <h1>CAPSIZED</h1>
      <p id="final-stats"></p>
      <button id="restart-btn">Try Again</button>
    </div>

    <div id="pause-screen" class="screen hidden">
      <h1>PAUSED</h1>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
