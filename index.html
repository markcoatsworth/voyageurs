<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- lang="en" above isn't enough on its own — Chrome's translate feature
       runs its own content-based language model rather than fully trusting
       the declared lang, and this page is genuinely dense with French
       (village names, song titles, in-game banner text), enough to trip
       that model into offering to translate from French. translate="no"
       plus this meta tag are the two standard, Chrome-specific signals
       that actually suppress the offer rather than just declaring a
       language it can second-guess. -->
  <meta name="google" content="notranslate" />
  <title>Voyageurs</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app"></div>

  <div id="ui">
    <!-- Mute/pause and the minimap (appended below the buttons by main.js)
         share the top-right corner: a column, right-aligned, so a square
         minimap wider than the two buttons still lines up sensibly under
         them. -->
    <div id="right-panel">
      <div id="right-buttons">
        <button id="mute-btn" title="Turn the music off">MUSIC ON</button>
        <button id="pause-btn" title="Pause the game">PAUSE</button>
      </div>
    </div>

    <!-- The steer pad: a round thumb-stick marked with direction arrows.
         See src/core/touchControls.js. #touch-dpad stays the positioned
         wrapper main.js's resize() moves around. -->
    <div id="touch-dpad">
      <div id="steer-pad" title="Steer / paddle">
        <span class="steer-arrow steer-up">&#9650;</span>
        <span class="steer-arrow steer-left">&#9664;</span>
        <span class="steer-arrow steer-right">&#9654;</span>
        <span class="steer-arrow steer-down">&#9660;</span>
        <div id="steer-knob"></div>
      </div>
    </div>

    <!-- Weapon controls: the mirror of #touch-dpad on the opposite (left)
         edge. Hidden until the pistol is picked up from the Montréal
         gunsmith (game.js toggles .hidden); main.js's resize() keeps it
         level with the move controls. Just the Z button for now — more
         slots join it here as further guns unlock. -->
    <div id="weapon-dpad" class="hidden">
      <button id="fire-z" class="weapon-key" title="Fire pistol (Z)">Z</button>
    </div>

    <div id="hud" class="hidden">
      <div id="hud-score">FURS: 0</div>
      <div id="hud-health-label">HULL HEALTH</div>
      <div id="hud-health-wrap"><div id="hud-health-fill"></div></div>
      <div id="hud-speed-label">CURRENT SPEED</div>
      <div id="hud-speed-wrap"><div id="hud-speed-fill"></div></div>
    </div>

    <!-- Le Diable's health, shown only during the boss fight at the head of
         the Chasse-galerie (game.js drives it from diablePct). Separate from
         #hud so it can sit centred at the top over the storm. -->
    <div id="hud-diable" class="hidden">
      <div id="hud-diable-label">LE DIABLE</div>
      <div id="hud-diable-wrap"><div id="hud-diable-fill"></div></div>
    </div>

    <div id="damage-flash"></div>

    <div id="title-screen" class="screen intro">
      <h1>VOYAGEURS</h1>
    </div>

    <div id="milestone-banner"></div>

    <!-- "Now playing" card, bottom-left. Filled and shown/hidden by
         main.js as the music playlist (src/audio/music.js) advances. -->
    <div id="now-playing" aria-live="polite"></div>

    <div id="gameover-screen" class="screen hidden">
      <h1 id="gameover-title">CAPSIZED</h1>
      <p id="final-stats"></p>
      <button id="restart-btn">Try Again</button>
    </div>

    <div id="pause-screen" class="screen hidden">
      <h1>PAUSED</h1>
    </div>
  </div>

  <!-- On-screen error reporting. Defined inline + as a classic (non-module)
       script so it is guaranteed to be running before main.js is even
       fetched — a throw during module *load* (a bad import, a stale
       reference at module top level) happens before any of main.js's own
       error handling can run, and would otherwise just leave the title
       screen frozen with the error only in the F12 console.

       window.showVoyageursError(summary, detail, opts) draws the panel;
       main.js calls the same function for runtime crashes so there's one
       consistent error UI. -->
  <script>
    (function () {
      var shown = false;

      function showVoyageursError(summary, detail, opts) {
        opts = opts || {};
        // First error wins the panel; later ones just bump a counter so a
        // cascade doesn't hide the root cause.
        if (shown) {
          var more = document.getElementById('voyageurs-error-more');
          if (more) {
            var n = (parseInt(more.getAttribute('data-n'), 10) || 0) + 1;
            more.setAttribute('data-n', n);
            more.textContent = '+ ' + n + ' more error' + (n === 1 ? '' : 's') + ' after this one (see the F12 console)';
            more.style.display = 'block';
          }
          return;
        }
        shown = true;
        window.__voyageursErrorShown = true;

        var detailText = String(detail == null ? summary : detail);
        var whenLine = opts.when
          ? 'This happened while ' + opts.when + '.'
          : 'Something went wrong.';
        var lostLine = opts.fatal === false
          ? 'The game is still running, but may not behave correctly — reloading is safest.'
          : 'This run has stopped. Reload to start again.';

        var root = document.createElement('div');
        root.id = 'voyageurs-error';
        root.setAttribute('role', 'alertdialog');
        root.style.cssText =
          'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;' +
          'justify-content:center;padding:20px;box-sizing:border-box;' +
          'background:rgba(10,8,16,0.86);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';

        var card = document.createElement('div');
        card.style.cssText =
          'width:100%;max-width:620px;max-height:88vh;overflow:auto;background:#f3e6c8;' +
          'color:#2b2213;border:3px solid #7a1d1d;border-radius:8px;' +
          'box-shadow:0 18px 60px rgba(0,0,0,0.55)';

        var bar = document.createElement('div');
        bar.style.cssText =
          'background:#7a1d1d;color:#f3e6c8;padding:12px 18px;font-size:15px;font-weight:700;' +
          'letter-spacing:0.02em;display:flex;align-items:center;gap:10px';
        bar.textContent = '⚠  Voyageurs hit an error';
        card.appendChild(bar);

        var body = document.createElement('div');
        body.style.cssText = 'padding:16px 18px 18px';

        body.appendChild(mk('p', 'font-size:13px;margin:0 0 4px;font-weight:700', summary || 'Unexpected error'));
        body.appendChild(mk('p', 'font-size:12px;margin:0 0 2px;color:#5a4a2a', whenLine));
        body.appendChild(mk('p', 'font-size:12px;margin:0 0 12px;color:#5a4a2a', lostLine));

        var pre = mk('pre', 'margin:0 0 12px;padding:10px 12px;background:#2b2213;color:#f0b8a0;' +
          'font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;' +
          'border-radius:5px;max-height:34vh;overflow:auto');
        pre.textContent = detailText;
        body.appendChild(pre);

        var more = mk('p', 'font-size:11px;margin:0 0 12px;color:#7a1d1d;font-weight:700;display:none', '');
        more.id = 'voyageurs-error-more';
        more.setAttribute('data-n', '0');
        body.appendChild(more);

        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap';

        row.appendChild(btn('Reload game', '#7a1d1d', '#f3e6c8', function () {
          window.location.reload();
        }));
        row.appendChild(btn('Copy error details', '#d8c49a', '#2b2213', function (b) {
          var payload =
            'Voyageurs error\n' + whenLine + '\n' + (summary || '') + '\n\n' + detailText +
            '\n\nUA: ' + navigator.userAgent + '\nURL: ' + window.location.href;
          copyText(payload, function (ok) {
            b.textContent = ok ? 'Copied ✓' : 'Press Ctrl+C to copy';
            if (!ok) selectNode(pre);
            setTimeout(function () { b.textContent = 'Copy error details'; }, 2200);
          });
        }));

        body.appendChild(row);
        body.appendChild(mk('p', 'font-size:11px;margin:12px 0 0;color:#5a4a2a',
          'If this keeps happening, copy the details above and send them along — that’s enough to pin down the cause.'));

        card.appendChild(body);
        root.appendChild(card);
        (document.body || document.documentElement).appendChild(root);

        function mk(tag, css, text) {
          var el = document.createElement(tag);
          el.style.cssText = css;
          if (text != null) el.textContent = text;
          return el;
        }
        function btn(label, bg, fg, onClick) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          b.style.cssText =
            'font:inherit;font-size:12px;font-weight:700;padding:9px 14px;border:0;border-radius:5px;' +
            'cursor:pointer;background:' + bg + ';color:' + fg;
          b.addEventListener('click', function () { onClick(b); });
          return b;
        }
      }

      function copyText(text, done) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
            return;
          }
        } catch (e) { /* fall through */ }
        done(false);
      }
      function selectNode(node) {
        try {
          var r = document.createRange();
          r.selectNodeContents(node);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        } catch (e) { /* ignore */ }
      }

      window.showVoyageursError = showVoyageursError;

      function phase() {
        return window.__voyageursReady ? 'running the game' : 'loading the game';
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? '\n    at ' + e.filename + ':' + e.lineno + ':' + e.colno : '';
        showVoyageursError(
          e.message || 'Script error',
          ((e.error && e.error.stack) || e.message || String(e)) + where,
          { when: phase(), fatal: !window.__voyageursReady }
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        showVoyageursError(
          'Unhandled promise rejection',
          (e.reason && e.reason.stack) || String(e.reason),
          { when: phase(), fatal: !window.__voyageursReady }
        );
      });
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
